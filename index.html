<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Moonlight Birthday</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Outfit:wght@300;500;700;800&display=swap">
<style>
/* Layout: greeting and wish button up top; below, the birthday star's gold medallion beside the moon girl. Single dark theme by choice. */
:root {
  --night: #0b0a24;
  --night-2: #1d1446;
  --gold: #ffd36e;
  --rose: #ff7aa8;
  --mint: #7cf0d0;
  --violet: #b48cff;
  --ink: #f6f0ff;
  --muted: #b9b0dc;
  --display: "Gloock", "Georgia", serif;
  --body: "Outfit", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { min-height: 100%; }
body {
  background: radial-gradient(120% 90% at 50% 100%, var(--night-2) 0%, var(--night) 60%) fixed;
  background-color: var(--night);
  color: var(--ink); font-family: var(--body);
  overflow-x: hidden;
}
#sky { position: fixed; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
.stage {
  position: relative; z-index: 1; min-height: 100%;
  display: flex; flex-direction: column; align-items: center; gap: clamp(14px, 2.5vh, 26px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: clamp(18px, 4vh, 40px);
  text-align: center;
}
.eyebrow { font-weight: 500; letter-spacing: .32em; text-transform: uppercase; font-size: clamp(11px, 1.6vw, 14px); color: var(--mint); margin: 0; }
h1 {
  font-family: var(--display); font-weight: 400; margin: .1em 0 0;
  font-size: clamp(44px, 10vw, 112px); line-height: .95; text-wrap: balance;
  background: linear-gradient(100deg, var(--gold) 10%, var(--rose) 50%, var(--gold) 90%);
  background-size: 200% 100%;
  -webkit-background-clip: text; background-clip: text; color: transparent;
  animation: shimmer 6s linear infinite;
  filter: drop-shadow(0 0 24px rgba(255, 122, 168, .35));
}
.date { font-family: var(--display); font-size: clamp(22px, 4vw, 38px); margin: .15em 0 0; }
.date span { color: var(--gold); }

/* wish button */
.wishbox { display: grid; gap: 10px; justify-items: center; }
.wish {
  position: relative; isolation: isolate; cursor: pointer; overflow: hidden;
  font: 800 clamp(17px, 2.2vw, 21px) var(--body); letter-spacing: .08em; text-transform: uppercase;
  color: var(--night); border: 0; border-radius: 999px; padding: 16px 38px;
  background: linear-gradient(90deg, var(--gold), var(--rose), var(--violet), var(--mint), var(--gold));
  background-size: 300% 100%;
  animation: flow 5s linear infinite, pulse 2.2s ease-out infinite;
  box-shadow: 0 0 30px rgba(255, 122, 168, .55), 0 0 0 0 rgba(255, 211, 110, .6);
  transition: transform .15s;
}
.wish::after {
  content: ""; position: absolute; inset: 0; z-index: -1;
  background: linear-gradient(110deg, transparent 30%, rgba(255,255,255,.75) 50%, transparent 70%);
  transform: translateX(-120%); animation: shine 2.8s ease-in-out infinite;
}
.wish svg { width: 1.05em; height: 1.05em; vertical-align: -.15em; margin-right: .45em; fill: currentColor; }
.wish:hover { transform: scale(1.06); }
.wish:active { transform: scale(.97); }
.wish:focus-visible { outline: 3px solid var(--ink); outline-offset: 4px; }
#msg { margin: 0; color: var(--muted); font-size: clamp(14px, 1.8vw, 17px); max-width: 46ch; line-height: 1.5; min-height: 3em; }

/* duo: medallion + moon scene */
.duo { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: clamp(16px, 4vw, 56px); width: min(1040px, 100%); }
.medal { position: relative; width: clamp(200px, 30vw, 290px); flex: none; padding-top: 46px; }
.medal .crown { position: absolute; top: 0; left: 50%; width: 46%; transform: translateX(-50%) rotate(-8deg); filter: drop-shadow(0 0 12px rgba(255, 211, 110, .7)); z-index: 2; animation: tilt 3s ease-in-out infinite alternate; }
.ring {
  position: relative; aspect-ratio: 34 / 42; max-width: 100%; border-radius: 50%; padding: 7px;
  background: conic-gradient(from 0deg, var(--gold), var(--rose), var(--violet), var(--mint), var(--gold));
  animation: spin 8s linear infinite;
  box-shadow: 0 0 40px rgba(255, 211, 110, .45), 0 0 90px rgba(180, 140, 255, .3);
}
.ring img { display: block; width: 100%; height: 100%; object-fit: cover; border-radius: 50%; animation: spin 8s linear infinite reverse; border: 3px solid var(--night); }
.ribbon {
  position: relative; z-index: 2; margin: -22px auto 0; width: max-content; max-width: 100%;
  font-family: var(--display); font-size: clamp(18px, 2.4vw, 24px); color: var(--night);
  background: linear-gradient(180deg, #ffe39a, var(--gold)); padding: 6px 22px; border-radius: 6px;
  box-shadow: 0 6px 20px rgba(0,0,0,.4);
}
.scene { width: min(520px, 100%); flex: 1 1 320px; min-width: 0; }
.scene svg { width: 100%; height: auto; display: block; overflow: visible; }

.flame { transform-box: fill-box; transform-origin: 50% 100%; animation: flicker .18s ease-in-out infinite alternate; transition: opacity .4s, transform .4s; }
.out .flame { opacity: 0; transform: scale(.2); animation: none; }
.hair { transform-box: fill-box; transform-origin: 10% 10%; animation: wind 3.5s ease-in-out infinite alternate; }
.legs { transform-box: fill-box; transform-origin: 50% 0%; animation: swing 2.6s ease-in-out infinite alternate; }
.blink { transform-box: fill-box; transform-origin: 50% 50%; animation: blink 4.5s infinite; }
.moon { animation: bob 6s ease-in-out infinite alternate; }

@keyframes shimmer { to { background-position: -200% 0; } }
@keyframes flow { to { background-position: -300% 0; } }
@keyframes shine { 0%, 40% { transform: translateX(-120%); } 80%, 100% { transform: translateX(120%); } }
@keyframes pulse { 70% { box-shadow: 0 0 30px rgba(255,122,168,.55), 0 0 0 18px rgba(255,211,110,0); } 100% { box-shadow: 0 0 30px rgba(255,122,168,.55), 0 0 0 0 rgba(255,211,110,0); } }
@keyframes spin { to { rotate: 360deg; } }
@keyframes tilt { to { transform: translateX(-50%) rotate(8deg); } }
@keyframes flicker { from { transform: scaleY(1) skewX(-3deg); } to { transform: scaleY(1.15) skewX(3deg); } }
@keyframes wind { from { transform: rotate(-2deg); } to { transform: rotate(3deg); } }
@keyframes swing { from { transform: rotate(-6deg); } to { transform: rotate(7deg); } }
@keyframes blink { 0%, 94%, 100% { transform: scaleY(1); } 97% { transform: scaleY(.1); } }
@keyframes bob { from { transform: translateY(-6px); } to { transform: translateY(6px); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }
</style>

<script>
(() => {
  const cv = document.getElementById('sky'), ctx = cv.getContext('2d');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const colors = ['#ffd36e', '#ff7aa8', '#7cf0d0', '#b48cff', '#ffffff'];
  let W, H, dpr, stars = [], parts = [], lanterns = [];

  function size() {
    dpr = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    stars = Array.from({ length: Math.round(W * H / 3500) }, () => ({
      x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.4 + .2, p: Math.random() * 6.28
    }));
  }
  addEventListener('resize', size); size();

  function burst(x, y, n = 70, power = 5) {
    const c = colors[Math.random() * colors.length | 0];
    for (let i = 0; i < n; i++) {
      const a = Math.random() * 6.28, s = Math.random() * power + 1;
      parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 1, c: Math.random() < .2 ? '#fff' : c, heart: false });
    }
  }
  function heart(x, y, scale = 7) {
    for (let t = 0; t < 6.28; t += .07) {
      const hx = 16 * Math.sin(t) ** 3, hy = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
      parts.push({ x, y, vx: hx * scale / 40, vy: hy * scale / 40, life: 1.3, c: '#ff7aa8', heart: true });
    }
  }
  function lantern() {
    lanterns.push({ x: Math.random() * W, y: H + 30, s: Math.random() * .5 + .4, sway: Math.random() * 6.28, v: Math.random() * .4 + .3 });
  }
  for (let i = 0; i < 8; i++) { lantern(); lanterns[i].y = Math.random() * H; }

  // sparkler tip position in page coordinates
  const tip = document.getElementById('sparkTip');
  function tipPos() { const r = tip.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; }

  let t = 0, next = 60;
  function frame() {
    t++;
    ctx.clearRect(0, 0, W, H);
    for (const s of stars) {
      ctx.globalAlpha = .4 + .6 * Math.abs(Math.sin(s.p + t * .02));
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.28); ctx.fill();
    }
    ctx.globalAlpha = 1;
    for (const l of lanterns) {
      l.y -= l.v; l.sway += .01; const x = l.x + Math.sin(l.sway) * 12;
      const g = ctx.createRadialGradient(x, l.y, 0, x, l.y, 26 * l.s);
      g.addColorStop(0, 'rgba(255,190,90,.55)'); g.addColorStop(1, 'rgba(255,190,90,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, l.y, 26 * l.s, 0, 6.28); ctx.fill();
      ctx.fillStyle = '#ffb347'; ctx.fillRect(x - 6 * l.s, l.y - 9 * l.s, 12 * l.s, 16 * l.s);
      if (l.y < -40) { l.y = H + 30; l.x = Math.random() * W; }
    }
    if (!reduce && --next <= 0) { burst(Math.random() * W, Math.random() * H * .45 + 20); next = 70 + Math.random() * 90; }
    if (!reduce && t % 2 === 0) {
      const [sx, sy] = tipPos();
      for (let i = 0; i < 3; i++) { const a = Math.random() * 6.28, s = Math.random() * 2; parts.push({ x: sx, y: sy, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: .5, c: '#fff3c4', heart: false }); }
    }
    ctx.globalCompositeOperation = 'lighter';
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      p.x += p.vx; p.y += p.vy; p.vx *= .97; p.vy = p.vy * .97 + (p.heart ? .005 : .05); p.life -= .012;
      if (p.life <= 0) { parts[i] = parts[parts.length - 1]; parts.pop(); continue; }
      ctx.globalAlpha = Math.min(1, p.life); ctx.fillStyle = p.c;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.heart ? 2.2 : 1.8, 0, 6.28); ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  addEventListener('pointerdown', e => { if (!e.target.closest('.wish')) burst(e.clientX, e.clientY, 90, 6); });

  const scene = document.getElementById('scene'), btn = document.getElementById('wish'), msg = document.getElementById('msg'), label = document.getElementById('wishLabel');
  btn.addEventListener('click', () => {
    if (scene.classList.contains('out')) {
      scene.classList.remove('out'); label.textContent = 'Make a wish';
      msg.textContent = 'Candles relit. One more wish never hurt anyone.';
      return;
    }
    scene.classList.add('out'); label.textContent = 'Relight the candles';
    msg.textContent = 'Wish sent to the moon. May this year be your most legendary one yet.';
    heart(W / 2, H * .3, 9);
    for (let i = 0; i < 6; i++) setTimeout(() => burst(Math.random() * W, Math.random() * H * .5 + 20, 110, 7), i * 260);
    for (let i = 0; i < 6; i++) lantern();
  });
})();
</script>

</body></html>
